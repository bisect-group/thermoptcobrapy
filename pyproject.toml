[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thermoptcobrapy"
version = "0.1.0.dev0"
description = "A Python port of the ThermOptCOBRA MATLAB package for cobrapy: thermodynamically feasible consistency, cycle enumeration, flux correction and context-specific models."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["cobra>=0.29", "numpy>=1.21", "spectra-cobra"]

[project.optional-dependencies]
development = ["black", "flake8", "isort", "pytest", "pytest-cov"]
gurobi = ["gurobipy"]
cplex = ["cplex"]

[project.urls]
Homepage = "https://github.com/bisect-group/thermoptcobrapy"
MATLAB = "https://github.com/bisect-group/Protocol_ThermOptCOBRA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 88
